name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Read the coverage baseline uploaded by the latest successful run on main.
  actions: read

env:
  # Build and test on a Go release that still gets security fixes. The
  # module minimum (go.mod) stays at what the Stellar SDK requires.
  GO_VERSION: "1.26"
  # A pull request fails if total coverage drops by more than this many
  # percentage points compared with main.
  COVERAGE_MAX_DROP: "1.0"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soroforge
          POSTGRES_PASSWORD: soroforge
          POSTGRES_DB: soroforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soroforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # TEST_DATABASE_URL turns on the Postgres half of the store
      # conformance suite; without it those cases would silently skip.
      # The live testnet smoke tests stay off: CI must not depend on a
      # public RPC endpoint being up.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://soroforge:soroforge@localhost:5432/soroforge?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      # main keeps its profile as the baseline pull requests compare against.
      - name: Upload coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-main
          path: coverage.out
          retention-days: 90

      # Fetches coverage.out from the newest successful CI run on main. No
      # third-party service: the baseline is an artifact of this workflow.
      - name: Download coverage baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --event push --status success --limit 1 \
            --json databaseId -q '.[0].databaseId')
          if [ -n "$run_id" ] && gh run download "$run_id" -R "$GITHUB_REPOSITORY" \
              -n coverage-main -D coverage-base; then
            echo "Baseline: run $run_id on main"
          else
            echo "::notice::No coverage baseline from main yet; reporting without the regression check."
          fi

      # Writes a per-package table to the job summary. On a pull request it
      # also shows the change against main and fails on a large regression.
      - name: Coverage report
        run: |
          if [ -f coverage-base/coverage.out ]; then
            scripts/coverage.sh coverage.out coverage-base/coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
          else
            scripts/coverage.sh coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t soroforge:ci .
